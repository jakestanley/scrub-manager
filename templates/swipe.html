<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrub Manager Swipe</title>
    <style>
        :root {
            --page-bg: #f4f6fb;
            --surface: #ffffff;
            --surface-muted: #f1f5f9;
            --primary: #2563eb;
            --keep: #16a34a;
            --danger: #dc2626;
            --text: #0f172a;
            --muted: #6b7280;
            --border: #e2e8f0;
            --radius: 16px;
            --shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, #eef2ff 0%, #fdf2f8 45%, #f4f6fb 100%);
            overflow: hidden;
        }

        button, select {
            font: inherit;
        }

        .app {
            height: 100%;
            max-width: 560px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px 12px;
        }

        header a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        header select {
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            max-width: 60%;
        }

        .stats {
            width: 100%;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .stage {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        .card {
            position: absolute;
            inset: 0;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
            cursor: grab;
        }

        .card.dragging {
            cursor: grabbing;
        }

        .card.flying {
            transition: transform 0.25s ease-in, opacity 0.25s ease-in;
        }

        .card.returning {
            transition: transform 0.2s ease-out;
        }

        .media {
            flex: 1;
            min-height: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cbd5e1;
            font-size: 0.95rem;
            text-align: center;
            padding: 0;
        }

        .media video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .info {
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info h2 {
            margin: 0;
            font-size: 1.05rem;
            word-break: break-word;
        }

        .info p {
            margin: 0;
            font-size: 0.85rem;
            color: var(--muted);
            word-break: break-word;
        }

        .stamp {
            position: absolute;
            top: 20px;
            padding: 6px 14px;
            border: 3px solid currentColor;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: 0.08em;
            background: rgba(255, 255, 255, 0.85);
            opacity: 0;
            pointer-events: none;
        }

        .stamp.keep {
            left: 20px;
            color: var(--keep);
            transform: rotate(-12deg);
        }

        .stamp.delete {
            right: 20px;
            color: var(--danger);
            transform: rotate(12deg);
        }

        .empty {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            color: var(--muted);
            background: var(--surface-muted);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            padding: 24px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr auto auto 1fr;
            gap: 10px;
        }

        .btn {
            border: none;
            border-radius: 999px;
            padding: 14px 16px;
            font-weight: 600;
            cursor: pointer;
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .btn.delete {
            background: var(--danger);
            color: #fff;
        }

        .btn.keep {
            background: var(--keep);
            color: #fff;
        }

        .hint {
            text-align: center;
            font-size: 0.75rem;
            color: var(--muted);
            margin: 0;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            max-width: calc(100% - 32px);
            background: var(--text);
            color: #fff;
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            box-shadow: var(--shadow);
            z-index: 10;
        }

        .toast[hidden] {
            display: none;
        }

        .toast span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .toast button {
            border: none;
            background: none;
            color: #93c5fd;
            font-weight: 700;
            cursor: pointer;
            padding: 4px;
        }

        @media (hover: none) {
            .hint { display: none; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <a href="/">&larr; Library</a>
            <select id="folderFilter" aria-label="Folder">
                <option value="">All folders</option>
            </select>
            <div class="stats" id="stats">Loading...</div>
        </header>

        <div class="stage" id="stage"></div>

        <div class="controls">
            <button type="button" class="btn delete" id="deleteBtn" onclick="decide('delete')">&larr; Delete</button>
            <button type="button" class="btn" id="skipBtn" onclick="decide('skip')" title="Decide later">Skip</button>
            <button type="button" class="btn" id="undoBtn" onclick="undo()" disabled>Undo</button>
            <button type="button" class="btn keep" id="keepBtn" onclick="decide('keep')">Keep &rarr;</button>
        </div>
        <p class="hint">Keys: &larr; delete &middot; &rarr; keep &middot; &darr; skip &middot; Z undo</p>
    </div>

    <div class="toast" id="toast" hidden>
        <span id="toastText"></span>
        <button type="button" id="toastUndo" onclick="undo()">Undo</button>
    </div>

    <script>
        const KEEP_TAG = {{ keep_tag|tojson }};
        // Deletes wait this long so they can be undone
        const DELETE_DELAY_MS = 8000;
        const SWIPE_THRESHOLD_PX = 110;

        let queue = [];
        let current = null;
        let remaining = 0;
        let fetching = null;
        // Paths decided this session, and paths skipped (offered again once everything else is done)
        const decided = new Set();
        const skipped = new Set();
        let pendingDelete = null;   // { file, timer }
        let lastAction = null;      // { type, file }
        const stats = { deleted: 0, kept: 0, freedBytes: 0 };
        let toastTimer = null;

        function formatBytes(bytes) {
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            let i = 0;
            while (bytes >= 1024 && i < units.length - 1) {
                bytes /= 1024;
                i++;
            }
            return `${bytes.toFixed(1)} ${units[i]}`;
        }

        function formatBitRate(bitRate) {
            if (!bitRate) return '';
            if (bitRate >= 1000000) return `${(bitRate / 1000000).toFixed(1)} Mbps`;
            return `${Math.round(bitRate / 1000)} kbps`;
        }

        function formatDuration(seconds) {
            if (!seconds) return '';
            const h = Math.floor(seconds / 3600);
            const m = Math.round((seconds % 3600) / 60);
            return h ? `${h}h ${m}m` : `${m}m`;
        }

        function folderValue() {
            return document.getElementById('folderFilter').value;
        }

        function updateStats() {
            document.getElementById('stats').textContent =
                `Deleted ${stats.deleted} (${formatBytes(stats.freedBytes)} freed) · Kept ${stats.kept} · ${remaining} left to sort`;
        }

        function fillQueue() {
            // Share one request between callers
            if (fetching) return fetching;
            fetching = (async () => {
                try {
                    let url = '/api/random?count=20';
                    if (folderValue()) url += '&folder=' + encodeURIComponent(folderValue());
                    const response = await fetch(url);
                    const data = await response.json();
                    remaining = data.remaining;
                    const queued = new Set(queue.map(f => f.full_path));
                    data.files.forEach(file => {
                        const path = file.full_path;
                        if (decided.has(path) || skipped.has(path) || queued.has(path)) return;
                        if (current && current.full_path === path) return;
                        queue.push(file);
                    });
                    updateStats();
                } catch (err) {
                    showToast('Failed to load videos: ' + err.message, false);
                } finally {
                    fetching = null;
                }
            })();
            return fetching;
        }

        async function showNext() {
            current = queue.shift() || null;
            if (!current) {
                await fillQueue();
                current = queue.shift() || null;
            }
            render();
            if (queue.length < 5) fillQueue();
        }

        function render() {
            const stage = document.getElementById('stage');
            stage.innerHTML = '';
            const hasCard = Boolean(current);
            ['deleteBtn', 'skipBtn', 'keepBtn'].forEach(id => document.getElementById(id).disabled = !hasCard);

            if (!hasCard) {
                const empty = document.createElement('div');
                empty.className = 'empty';
                const message = document.createElement('p');
                if (skipped.size) {
                    message.textContent = `Nothing left except the ${skipped.size} you skipped.`;
                    const again = document.createElement('button');
                    again.type = 'button';
                    again.className = 'btn';
                    again.textContent = 'Go through skipped videos';
                    again.addEventListener('click', () => {
                        skipped.clear();
                        showNext();
                    });
                    empty.append(message, again);
                } else {
                    message.textContent = 'All sorted. Nothing left to decide here.';
                    empty.append(message);
                }
                stage.appendChild(empty);
                return;
            }

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="media"></div>
                <div class="stamp keep">KEEP</div>
                <div class="stamp delete">DELETE</div>
                <div class="info">
                    <h2></h2>
                    <p class="dir"></p>
                    <p class="meta"></p>
                </div>
            `;

            const media = card.querySelector('.media');
            if (current.status === 'ready') {
                const video = document.createElement('video');
                video.src = `/api/scrub?path=${encodeURIComponent(current.full_path)}`;
                video.autoplay = true;
                video.muted = true;
                video.loop = true;
                video.playsInline = true;
                video.draggable = false;
                media.appendChild(video);
            } else {
                media.textContent = 'No preview yet';
            }

            card.querySelector('h2').textContent = current.filename;
            card.querySelector('.dir').textContent = current.relative_dir === '.' ? '' : current.relative_dir;
            card.querySelector('.meta').textContent = [
                current.size, formatBitRate(current.bit_rate), formatDuration(current.duration),
            ].filter(Boolean).join(' · ');

            attachDrag(card);
            stage.appendChild(card);
        }

        function attachDrag(card) {
            let startX = null;
            let dx = 0;
            const keepStamp = card.querySelector('.stamp.keep');
            const deleteStamp = card.querySelector('.stamp.delete');

            card.addEventListener('pointerdown', event => {
                startX = event.clientX;
                dx = 0;
                card.setPointerCapture(event.pointerId);
                card.classList.add('dragging');
                card.classList.remove('returning');
            });

            card.addEventListener('pointermove', event => {
                if (startX === null) return;
                dx = event.clientX - startX;
                card.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
                keepStamp.style.opacity = Math.max(0, Math.min(1, dx / SWIPE_THRESHOLD_PX));
                deleteStamp.style.opacity = Math.max(0, Math.min(1, -dx / SWIPE_THRESHOLD_PX));
            });

            const release = () => {
                if (startX === null) return;
                startX = null;
                card.classList.remove('dragging');
                if (dx > SWIPE_THRESHOLD_PX) {
                    decide('keep');
                } else if (dx < -SWIPE_THRESHOLD_PX) {
                    decide('delete');
                } else {
                    card.classList.add('returning');
                    card.style.transform = '';
                    keepStamp.style.opacity = 0;
                    deleteStamp.style.opacity = 0;
                }
            };
            card.addEventListener('pointerup', release);
            card.addEventListener('pointercancel', release);
        }

        function flyOff(direction) {
            const card = document.querySelector('.stage .card');
            if (!card) return Promise.resolve();
            const x = direction === 'up' ? 0 : (direction === 'right' ? 1 : -1) * window.innerWidth * 1.5;
            const y = direction === 'up' ? -window.innerHeight : 0;
            card.querySelector(`.stamp.${direction === 'right' ? 'keep' : 'delete'}`).style.opacity =
                direction === 'up' ? 0 : 1;
            card.classList.add('flying');
            card.style.transform = `translate(${x}px, ${y}px) rotate(${x / 40}deg)`;
            card.style.opacity = direction === 'up' ? 0 : 1;
            return new Promise(resolve => setTimeout(resolve, 250));
        }

        let deciding = false;

        async function decide(type) {
            if (!current || deciding) return;
            deciding = true;
            const file = current;
            const path = file.full_path;

            if (type === 'keep') {
                decided.add(path);
                stats.kept++;
                remaining = Math.max(0, remaining - 1);
                postJson('/api/tag', { filepath: path, tag: KEEP_TAG, action: 'add' })
                    .catch(err => showToast('Failed to keep: ' + err.message, false));
                showToast(`Kept ${file.filename}`, true);
            } else if (type === 'delete') {
                // Only one delete waits at a time; the previous one goes through now
                commitPendingDelete();
                decided.add(path);
                stats.deleted++;
                stats.freedBytes += file.size_bytes;
                remaining = Math.max(0, remaining - 1);
                pendingDelete = { file, timer: setTimeout(commitPendingDelete, DELETE_DELAY_MS) };
                showToast(`Deleting ${file.filename}`, true, DELETE_DELAY_MS);
            } else {
                skipped.add(path);
                showToast(`Skipped ${file.filename}`, true);
            }
            lastAction = { type, file };
            document.getElementById('undoBtn').disabled = false;
            updateStats();

            await flyOff(type === 'keep' ? 'right' : type === 'delete' ? 'left' : 'up');
            await showNext();
            deciding = false;
        }

        function commitPendingDelete() {
            if (!pendingDelete) return;
            const { file, timer } = pendingDelete;
            clearTimeout(timer);
            pendingDelete = null;
            if (lastAction && lastAction.file === file) {
                lastAction = null;
                document.getElementById('undoBtn').disabled = true;
            }
            postJson('/api/delete', { filepath: file.full_path }).catch(err => {
                stats.deleted--;
                stats.freedBytes -= file.size_bytes;
                updateStats();
                showToast(`Failed to delete ${file.filename}: ${err.message}`, false);
            });
        }

        function undo() {
            if (!lastAction || deciding) return;
            const { type, file } = lastAction;
            const path = file.full_path;

            if (type === 'delete') {
                if (!pendingDelete || pendingDelete.file !== file) return;
                clearTimeout(pendingDelete.timer);
                pendingDelete = null;
                stats.deleted--;
                stats.freedBytes -= file.size_bytes;
                remaining++;
            } else if (type === 'keep') {
                stats.kept--;
                remaining++;
                postJson('/api/tag', { filepath: path, tag: KEEP_TAG, action: 'remove' })
                    .catch(err => showToast('Failed to undo keep: ' + err.message, false));
            }
            decided.delete(path);
            skipped.delete(path);
            lastAction = null;
            document.getElementById('undoBtn').disabled = true;
            hideToast();

            if (current) queue.unshift(current);
            current = file;
            render();
            updateStats();
        }

        async function postJson(url, body) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                throw new Error(data.error || response.statusText);
            }
            return response.json();
        }

        function showToast(text, withUndo, duration = 4000) {
            document.getElementById('toastText').textContent = text;
            document.getElementById('toastUndo').hidden = !withUndo;
            document.getElementById('toast').hidden = false;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(hideToast, duration);
        }

        function hideToast() {
            document.getElementById('toast').hidden = true;
        }

        async function loadFolders() {
            const response = await fetch('/api/folders');
            const folders = await response.json();
            const select = document.getElementById('folderFilter');
            let saved = '';
            try {
                saved = localStorage.getItem('scrub-manager-swipe-folder') || '';
            } catch (err) {
                // Storage unavailable; start with all folders
            }
            folders.forEach(folder => {
                const option = document.createElement('option');
                option.value = folder;
                const depth = folder.split('/').length - 1;
                option.textContent = '   '.repeat(depth) + folder.split('/').pop();
                option.title = folder;
                select.appendChild(option);
            });
            if (folders.includes(saved)) select.value = saved;
        }

        async function changeFolder() {
            try {
                localStorage.setItem('scrub-manager-swipe-folder', folderValue());
            } catch (err) {
                // Storage unavailable; the choice just isn't remembered
            }
            queue = [];
            current = null;
            skipped.clear();
            await fillQueue();
            await showNext();
        }

        document.addEventListener('keydown', event => {
            if (event.target.matches('select, input')) return;
            if (event.key === 'ArrowLeft') decide('delete');
            else if (event.key === 'ArrowRight') decide('keep');
            else if (event.key === 'ArrowDown') decide('skip');
            else if (event.key === 'z' || event.key === 'Z') undo();
            else return;
            event.preventDefault();
        });

        // Closing the page shouldn't cancel a delete that's waiting for its undo window
        window.addEventListener('pagehide', () => {
            if (!pendingDelete) return;
            const body = new Blob([JSON.stringify({ filepath: pendingDelete.file.full_path })], { type: 'application/json' });
            navigator.sendBeacon('/api/delete', body);
            pendingDelete = null;
        });

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('folderFilter').addEventListener('change', changeFolder);
            try {
                await loadFolders();
            } catch (err) {
                console.error('Failed to load folders:', err);
            }
            await fillQueue();
            await showNext();
        });
    </script>
</body>
</html>
